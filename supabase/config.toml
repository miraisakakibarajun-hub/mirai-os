# Local disposable CI project only. Never link to a hosted project.
project_id = "mirai-phase3b-isolated"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
# Explicit privileges are mandatory.
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"
[db.migrations]
enabled = true
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = false
[storage]
enabled = false
[analytics]
enabled = false
[edge_runtime]
enabled = false
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = false
enable_confirmations = true
