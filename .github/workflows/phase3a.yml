name: Phase 3 isolated checks
on:
  push:
    branches: [phase3a/safe-development-foundation, phase3b/formal-authorization-model, phase3c/authorized-business-ui, phase3d/operational-management, phase3e/staging-recovery-preparation]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase3a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-test-key
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Secret patterns and environment file policy
        run: npm run check:secrets
      - name: Dependency security
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: mirai_phase3a
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d mirai_phase3a"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild preserved migrations and deny unsafe operations
        run: npm run test:db:postgres
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start disposable local Supabase only
        run: |
          mkdir -p test-results
          npx --no-install supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > test-results/startup.log
          npx --no-install supabase status -o json > test-results/local-supabase.json
      - name: Real Auth and PostgREST allow and deny tests
        run: npm run test:auth
      - name: Synthetic browser fixture
        run: npm run seed:browser
      - name: Install browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser to API to Auth to database
        run: npm run test:browser
      - name: Restore synthetic backup into rebuilt local stack
        run: npm run test:recovery
      - name: Login and business UI after recovery
        run: npx --no-install playwright test --config playwright.recovery.config.ts
      - name: Isolated database security advisors
        run: npx --no-install supabase db advisors --local --type security --fail-on error
      - name: Save synthetic test evidence only (never Auth keys or fixture credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3e-test-evidence
          path: |
            test-results/browser-results.json
            test-results/authorization-supabase.json
            test-results/recovery-rehearsal.json
            test-results/recovery-browser-results.json
            test-results/evidence/*.png
          retention-days: 7
      - name: Stop disposable stack
        if: always()
        run: npx --no-install supabase stop --no-backup
